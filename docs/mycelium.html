   6. 说人话: 每条错误都讲清"谁、为什么、怎么办"

     script#hypha          内核(本文件)
     script#hypha-launcher 启动器: 认血统、注入 env、调 boot

    return {
      get: async k => 拷(m.get(k)), set: async (k, v) => { m.set(k, 拷(v)); },
      del: async k => { m.delete(k); }, clear: async () => { m.clear() },
      list: async p => [...m].filter(([k]) => !p || String(k).startsWith(p))
        .map(([key, value]) => ({ key, value: 拷(value) })),
    };
  };
  const idbStore = name => {
    let dbp = null;
    const open = () => dbp || (dbp = new Promise((res, rej) => {
      const r = E.idb.open(name, 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    }));
    const op = (mode, fn) => open().then(db => new Promise((res, rej) => {
      const t = db.transaction('kv', mode), s = t.objectStore('kv'), q = fn(s);
      t.onerror = () => rej(t.error);
      if (q && 'onsuccess' in q) { q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }
      else t.oncomplete = () => res(q);
    })), w = fn => op('readwrite', fn).then(() => { });
    return {
      get: k => op('readonly', s => s.get(k)), set: (k, v) => w(s => s.put(v, k)),
      del: k => w(s => s.delete(k)), clear: () => w(s => s.clear()),
      list: p => op('readonly', s => {
        const r = p ? IDBKeyRange.bound(p, p + '\uffff') : undefined;
        return { ks: s.getAllKeys(r), vs: s.getAll(r) };
      }).then(r => r.ks.result.map((k, i) => ({ key: k, value: r.vs.result[i] }))),
    };
  };
  const Sub = {
    store: null, mem: false, journalRing: [],
    async open(id) {
      this.store = E.idb ? idbStore(id) : memStore();
      this.mem = !E.idb;
      if (E.idb) {
        try { await this.store.get(''); }   // 隐私模式/系统关数据: 退内存, 能看不能存
        catch (e) { this.store = memStore(); this.mem = true; this.warn = e?.message || String(e); }
      }
      return this;
    },
    get: async k => (await Sub.store.get(k)) ?? null,
    async set(k, v, by) {
      await Sub.store.set(k, v);
      Sub.记({ op: 'set', key: k, by, size: v == null ? 0 : JSON.stringify(v).length });
    },
    async del(k, by) {
      await Sub.store.del(k);
      Sub.记({ op: 'del', key: k, by });
    },
    list: p => Sub.store.list(p),
    记(e) {                                   // 事件日志: 审计环(内存 500 条) + 可选持久
      const x = Object.assign({ t: now(), seq: ++Sub.seq }, e);
      Sub.journalRing.push(x);
      if (Sub.journalRing.length > 500) Sub.journalRing.shift();
      emit('mycelium:journal', x);
    },
    seq: 0,
    read: ({ since = 0, limit = 200 } = {}) =>
      Sub.journalRing.filter(x => x.t >= since).slice(-limit),
    // 快照: 整库([k,v]) + 块记录, 存进 snapshot:<名>。回滚的权威手段。
    async snapshot(name) {
      const all = await Sub.store.list(''), entries = all.map(e => [e.key, e.value])
        .filter(([k]) => !k.startsWith('snapshot:'));
      const s = { name: name || uid('snap-'), at: now(), n: entries.length, entries };
      await Sub.store.set('snapshot:' + s.name, s);
      Sub.记({ op: 'snapshot', key: s.name, by: 'sub' });
      return { name: s.name, at: s.at, n: s.n };
    },
    snapshots: async () => (await Sub.store.list('snapshot:')).map(e => e.value)
      .sort((a, b) => b.at - a.at),
    async restore(name) {
      const s = await Sub.store.get('snapshot:' + name);
      if (!s) fail(`没有叫「${name}」的快照; 现有: ${(await Sub.snapshots()).map(x => x.name).join(', ')}`);
      const all = await Sub.store.list('');
      for (const e of all) if (!e.key.startsWith('snapshot:')) await Sub.store.del(e.key);
      for (const [k, v] of s.entries) await Sub.store.set(k, v);
      Sub.记({ op: 'restore', key: name, by: 'sub' });
      return { restored: name, keys: s.n, at: s.at };
    },
    async drop(name) { await Sub.store.del('snapshot:' + name); return { dropped: name }; },
  };

  // ══════════ 能力网 ══════════
  // 块、孢子、agent 之间都走这一张表。call 总回 Promise(抛错即拒绝)。
  // 三级权限:
  //   open     直接执行(读数据、算东西)
  //   notice   执行, 但广播 mycelium:notice(界面角标告诉用户"它调了这个")
  //   guarded  要人批准(改块、发消息、花钱的调用)。autonomy 记忆可选。
  // 每次调用留一条 span(示波器看得到), agent 调错的参数在调用前就被形状挡住。
  const Net = {
    CAP: {}, 私: {}, 外: null, spans: [], pending: new Map(), remembered: new Set(),
    认: m => m.caps || [m.id.split(':').pop()],
    头: p => String(p).split('.')[0],
    主: p => L.factory.find(b => Net.认(b.manifest).includes(Net.头(p))),
    provide(path, fn, meta = {}, by) {
      const c = { fn, by, desc: meta.desc || '', schema: meta.schema || null,
        level: meta.level || 'open', frames: meta.frames !== false,
        common: meta.common === true || undefined };
      // 前缀归哪块: 块清单 caps 写它有哪些前缀, 没写就是 id 末截; 内核自己的 hypha.* 总是公开
      const caps = by === 'hypha' ? ['hypha'] : (blockOf(by) ? Net.认(blockOf(by).manifest) : []);
      const T = caps.includes(Net.头(path)) ? Net.CAP : (Net.私[by] ||= {});
      if (T[path] && T[path].by !== by) fail(`能力撞名: ${path} 已由 ${T[path].by} 提供`);
      T[path] = c;
      emit('mycelium:cap', { path, by, type: 'add', level: c.level });
      return () => { delete T[path]; emit('mycelium:cap', { path, by, type: 'remove' }); };
    },
    找: (path, by) => Net.私[by]?.[path] || Net.CAP[path],
    has: (path, by) => !!Net.找(path, by),
    call(path, args, meta = {}) {
      return new Promise((res, rej) => {
        const c = Net.找(path, meta.by);
        if (!c && Net.外) return res(Net.外.call(path, clone({ ...args, stream: false })));
        if (!c) {
          const o = Net.主(path), near = Object.keys(Net.CAP).filter(p => Net.头(p) === Net.头(path)).sort();
          if (o && !L.inst[o.manifest.id]) return rej(new Error(`「${o.manifest.name || o.manifest.id}」块停用了, 调不了 ${path}`));
          return rej(new Error(`无此能力: ${path}` + (near.length ? `。同名空间下有: ${near.join(', ')}` : '。用 hypha.catalog 看清单')));
        }
        if (meta.frame && !c.frames) return rej(new Error(`隔离窗里不能调用 ${path}(它要改宿主)`));
        let a = args ?? {};
        try { checkShape(a, c.schema, path); }
        catch (e) { return rej(e); }
        const span = { id: uid('sp-'), path, by: meta.by || '?', level: c.level, at: now(), args: Net.摘要(a) };
        Net.spans.push(span);
        if (Net.spans.length > 500) Net.spans.shift();
        const done = err => { span.ms = now() - span.at; span.ok = !err; if (err) span.err = err.message; emit('mycelium:span', span); };
        const go = () => Promise.resolve()
          .then(() => c.fn(a, meta))
          .then(v => { done(null); res(v); }, e => { done(e); rej(e); });
        if (c.level === 'open') return go();
        if (c.level === 'notice') { emit('mycelium:notice', { path, by: meta.by, args: span.args, desc: c.desc }); return go(); }
        // guarded: 审批
        const auto = Net.remembered.has(path) && Net.autonomy !== 'ask';
        if (auto || Net.autonomy === 'auto') return go();
        if (!doc()) return rej(new Error(`${path} 要人批准, 但现在没有界面能问(无头环境默认拒绝)`));
        const req = { id: uid('ap-'), path, by: meta.by || '?', args: span.args, desc: c.desc, at: now() };
        Net.pending.set(req.id, { res, rej, span, go, req });
        emit('mycelium:approve', req);
        E.setTimeout(() => {
          if (Net.pending.has(req.id)) Net.decide(req.id, false);
        }, 300000);
      });
    },
    // 脱敏摘要: key/token/secret 打码, 长的截断
    摘要: a => {
      let s;
      try { s = JSON.stringify(a, (k, v) => /key|token|secret|password/i.test(k) ? '***' : v); }
      catch (e) { s = String(a); }
      return s.length > 300 ? s.slice(0, 300) + `…(共 ${s.length} 字)` : s;
    },
    autonomy: 'remember',                // 'ask' 每次问 | 'remember' 记住选择 | 'auto' 不拦
    decide(reqId, ok, remember) {
      const p = Net.pending.get(reqId);
      if (!p) return false;
      Net.pending.delete(reqId);
      if (remember) Net.remembered.add(p.req.path);
      if (ok) p.go(); else {
        const e = new Error(`用户拒绝了 ${p.req.path}`);
        p.span.ok = false; p.span.err = 'rejected'; emit('mycelium:span', p.span);
        p.rej(e);
      }
      return true;
    },
    catalog(by) {
      const T = { ...Net.CAP, ...Net.私[by] || {} };
      return Object.keys(T).sort().map(path => {
        const { fn, ...c } = T[path];
        return { path, desc: c.desc, level: c.level, schema: c.schema,
          args: shapeLine(c.schema), by: c.by, common: c.common };
      });
    },
    revoke(by) { [Net.CAP, Net.私[by] || {}].forEach(T => Object.keys(T).forEach(p => {
      if (T[p].by === by) { delete T[p]; emit('mycelium:cap', { path: p, by, type: 'remove' }); }
    })); },
    trace: ({ path, by, limit = 100 } = {}) => Net.spans.filter(s =>
      (!path || s.path.includes(path)) && (!by || s.by === by)).slice(-limit),
  };
  // 内核自己的能力: 实现它的段末尾登记。level: open 直接跑 / notice 跑但广播 / guarded 要人批准
  const P = (path, fn, desc, schema, frames, level) =>
    Net.provide(path, fn, { desc, schema, frames: frames !== false, common: true, level: level || 'open' }, 'hypha');

  // ══════════ 块接口 ══════════
  // 块代码 = function (ctx, __seg, colony) 的函数体, 不带 function 外壳。
  // ctx: id/root/kv/provide/call/has/on/cleanup/trace/log
  const L = { store: null, factory: [], recs: {}, inst: {}, errors: {}, broken: [],
    safe: false, head: '', launcher: '', stemFactory: '', booting: false };
  const blockOf = id => L.factory.find(b => b.manifest.id === id);
  const ctxFor = id => {
    const cleanups = [];
    let root = null;
    if (doc() && !E?.boot?.headless) {       // 无头(测试)不给 root: 块的界面代码自然不跑
      root = doc().createElement('div');
      root.setAttribute('data-nodule-id', id);
      (doc().getElementById('mycelium-root') || doc().body).appendChild(root);
      cleanups.push(() => root.remove());
    }
    const ctx = {
      id, root,
      provide: (path, fn, meta) => Net.provide(path, fn, meta, id),
      call: (path, args) => Net.call(path, args, { by: id }),
      has: path => Net.has(path, id),
      on: (name, fn) => { const off = on(name, fn); cleanups.push(off); return off; },
      trace: msg => { Sub.记({ op: 'log', key: id, by: id, note: String(msg).slice(0, 200) }); },
      log: (...a) => console.log('[' + id + ']', ...a),
      cleanup: fn => cleanups.push(fn),
      // kv 是全库共享; 块记录不让直接写, 因为那是 setNodule 的地盘
      kv: guardKv({
        get: k => Sub.get(k), set: (k, v) => Sub.set(k, v, id), del: k => Sub.del(k, id),
        list: p => Sub.list(p),
      }),
    };
    const colony = { call: ctx.call, has: ctx.has, get solo() { return !!BOOT.solo; } };
    return { ctx, cleanups, colony };
  };
  const guardKv = store => {           // 块记录只能经 setNodule 改
    const chk = k => String(k).startsWith('block:')
      ? Promise.reject(new Error('块记录只能经 hypha.setNodule 改: ' + k)) : Promise.resolve();
    return { get: k => store.get(k), set: (k, v) => chk(k).then(() => store.set(k, v)),
      del: k => chk(k).then(() => store.del(k)), list: p => store.list(p) };
  };

  // ══════════ 段值表 ══════════
  // 借用方拿到懒取值代理: 值不靠装载顺序, 源头晚到靠 mycelium:cap 事件接上
  const SEG = {};
  const segRef = (key, why) => {
    const peek = () => { try { return SEG[key]; } catch (e) { } }, get = () => {
      const v = peek();
      if (v === undefined) {
        const src = key.split('/')[0], b = blockOf(src), 开 = b && isEnabled(b);
        fail(b && 停(src) ? `源头块 ${src} ${开 ? '坏了' : '已禁用'}, 借不到 ${key}`
          + (why ? `; 剪不出一份来: ${why}` : '') + `: ${开 ? '修好' : '启用'}它, 或把这段复制过来`
          : `借的段还没就位: ${key}(源头块从未装载, 或它没有这个名字的段)`);
      }
      if (Object(v) !== v) fail(`借的 ${key} 是单个的值, 借过来是个代理, 用不了: 请包成对象`);
      return v;
    };
    return new Proxy(function () { }, {
      apply: (_, t, a) => get().apply(t, a),
      construct: (_, a) => Reflect.construct(get(), a),
      get: (_, p) => {
        if (typeof p !== 'string' || p === 'then' || p === 'toJSON') {
          const v = peek();
          return v == null ? undefined : v[p];
        }
        return get()[p];
      },
      set: (_, p, v) => { get()[p] = v; return true; },
      has: (t, p) => p in get() || p in t,
    });
  };
  // 段名/范围名都登记; 映射段生成 const 名 = __seg.ref('块/名')
  const forRun = (id, eff) => {
    const out = eff.prologue.slice();
    new Set(eff.segs.map(s => s.name).concat(Object.keys(lay(eff, id, 1).need))).forEach(n => {
      if (isIdent(n)) out.push(`__seg.set(${JSON.stringify(n)}, () => ${n});`);
    });
    eff.segs.forEach(s => {
      if (s.map) {
        if (!isIdent(s.name)) fail(`段名「${s.name}」不是合法标识符, 不能映射`);
        out.push(s.lines[0], `const ${s.name} = __seg.ref(${JSON.stringify(s.map.block + '/' + s.map.name)});`,
          ...s.lines.slice(1));
      } else out.push(headLine({ ...s, borrowers: [] }), ...s.lines.slice(1));
    });
    return out.join('\n');
  };
  const 停 = x => (x = blockOf(x)) && !(isEnabled(x) && !L.errors[x.manifest.id]);
  const 问来 = {};                     // 按需问来的(借用方跑起来才问得到)
  // 停用/坏掉的源头: 导出一个没有它的 Mycelium 时的那份(换剪一份), 剪不出的照旧借
  const 跑码 = b => {
    const id = b.manifest.id, eff = checkSegs(effectiveOf(b), id), 不 = {};
    return { 不, code: forRun(id, eff.segs.some(s => s.map && 停(s.map.block))
      ? parseSegs(换(joinSegs(eff), id, { has: x => !停(x) }, 问来, {}, 不).code) : eff) };
  };
  const 重剪 = async () => {
    const bs = L.factory.filter(b => L.inst[b.manifest.id]
      && effectiveOf(b).segs.some(s => s.map && blockOf(s.map.block)));
    Object.assign(问来, await 问(bs.filter(b => effectiveOf(b).segs.some(s => s.ask && 停(s.map?.block)))));
    const re = bs.filter(b => L.inst[b.manifest.id] && b._run !== 跑码(b).code);
    re.forEach(b => { dispose(b.manifest.id); tryRun(b); });
    if (re.length) emit('mycelium:blocks');
  };

  // ══════════ 装载 ══════════
  const isEnabled = b => {
    const r = L.safe ? null : L.recs[b.manifest.id];
    return r?.enabled !== undefined ? !!r.enabled : !b.adopted && !b.tagDisabled;
  };
  const instantiate = b => {
    const id = b.manifest.id;
    if (L.inst[id]) return;
    if (!isEnabled(b)) { L.errors[id] = '已禁用'; return; }
    const o = ctxFor(id);
    let seg = null;
    try {
      const r = 跑码(b);
      o.colony.停着 = x => 停(x) && (blockOf(x).manifest.name || x);
      b._run = r.code;
      checkCode(b._run, id);
      seg = {
        set: (n, get) => Object.defineProperty(SEG, id + '/' + n, { get, enumerable: true, configurable: true }),
        ref: k => segRef(k, r.不[k]),
        clear: () => Object.keys(SEG).forEach(k => { if (k.startsWith(id + '/')) delete SEG[k]; }),
      };
      const ret = new Function(...块参, b._run)(o.ctx, seg, o.colony);
      L.inst[id] = Object.assign(o, { dispose: ret?.dispose || null });
      delete L.errors[id];
    } catch (e) {
      o.cleanups.forEach(f => { try { f(); } catch (_) { } });
      Net.revoke(id);
      if (seg) seg.clear();
      L.errors[id] = 块参错(e) || e.message;
      throw e;
    }
  };
  const tryRun = b => { try { instantiate(b); } catch (e) { console.error('[nodule]', b.manifest.id, e); } };
  const 被借的先 = 序 => {              // 被借的先装: 源头坏了先露出来, 借它的装时就剪一份
    const 剩 = 序.splice(0), 借着 = b => effectiveOf(b).segs.some(s => 剩.some(x => x !== b
      && x.manifest.id === s.map?.block));
    while (剩.length) 序.push(...剩.splice(Math.max(0, 剩.findIndex(b => !借着(b))), 1));
  };
  const assembleAll = async () => {
    L.booting = true; L.errors = {}; L.broken = [];
    L.factory = [];
    // 上一次的兜底面板撤掉: 界面块可能回来了(它画在 mycelium-root 里, 会盖住块的界面)
    if (doc()) doc().querySelectorAll('[data-k-panel]').forEach(el => el.remove());
    if (doc()) doc().querySelectorAll(`${SCR}[type="mycelium/nodule"]`).forEach(el => {
      try {
        const b = parseBlock(el.textContent);
        if (blockOf(b.manifest.id)) fail('块 id 重复: ' + b.manifest.id);
        if (el.getAttribute('data-disabled')) b.tagDisabled = true;
        L.factory.push(b);
      } catch (e) { L.broken.push({ id: el.getAttribute('data-id') || '?', error: e.message }); }
    });
    L.recs = {};
    for (const e of await Sub.list('block:')) {
      const id = String(e.key).slice(6);
      L.recs[id] = e.value;
      if (!L.safe && e.value?.adopted && !blockOf(id)) {
        try { L.factory.push(Object.assign(parseBlock(e.value.adopted), { adopted: true })); }
        catch (err) { L.broken.push({ id, error: '收养记录损坏: ' + err.message }); }
      }
    }
    const 序 = L.factory.slice().sort((a, b) => a.manifest.id < b.manifest.id ? -1 : 1);
    被借的先(序);
    序.forEach(tryRun);
    await 重剪();
    L.booting = false;
    emit('mycelium:blocks');
  };
  const dispose = id => {
    const i = L.inst[id];
    if (!i) return;
    try { if (i.dispose) i.dispose(); } catch (e) { console.error('[dispose]', id, e); }
    i.cleanups.forEach(f => { try { f(); } catch (_) { } });
    Net.revoke(id);
    delete L.inst[id];
  };

  // ══════════ 块记录与改块 ══════════
  // 记录: {enabled?, adopted?, segs:{名:{edited, active}}, order?, prologue?, layoutActive?}
  // 原版永远在出厂文本里, 改版在记录里, active 说哪份显性
  const recKey = id => 'block:' + id;
  const effective = (factory, rec) => {
    const fp = typeof factory === 'string' ? parseSegs(factory) : factory, byName = {},
      segsRec = rec?.segs || {}, useLayout = rec?.layoutActive === 'edited',
      names = useLayout && rec.order ? rec.order.slice() : fp.segs.map(s => s.name), segs = [], deleted = [];
    fp.segs.forEach((s, i) => {
      byName[s.name] = s;
      if (!names.includes(s.name)) names.splice(Math.min(i, names.length), 0, s.name);
    });
    Object.keys(segsRec).forEach(n => { if (!names.includes(n)) names.splice(Math.max(names.length - 1, 0), 0, n); });
    names.forEach(n => {
      const r = segsRec[n], f = byName[n], hasEdit = !!r?.edited;
      if (r?.active === 'edited' && r.edited != null) {
        if (r.edited === '') return deleted.push(n);
        const lines = r.edited.split('\n');
        segs.push(Object.assign(mark(lines[0]) || blank(n), { name: n, text: r.edited, lines,
          use: 'edited', hasEdit, factoryText: f ? f.text : null }));
      } else if (f) segs.push(Object.assign({}, f, { use: 'factory', hasEdit, factoryText: f.text }));
    });
    return { prologue: useLayout && typeof rec.prologue === 'string' ? rec.prologue.split('\n') : fp.prologue,
      segs, deleted };
  };
  const effectiveOf = b => effective(parsedOf(b), L.safe ? null : L.recs[b.manifest.id]);
  const parsedOf = b => b._p?.src === b.code ? b._p : (b._p = Object.assign(parseSegs(b.code), { src: b.code }));
  const revOf = id => hash(id === 'hypha' ? stemUse() + stemEdited() : JSON.stringify(L.recs[id] || null));
  const 改版 = edited => ({ edited, active: 'edited' });
  // 记一段: 和出厂一字不差就不算改过, 否则存成显性改版

// ══════════ 模型调用 ══════════
const 模型调用 = {
  基: p => (p.endpoint || '').replace(/\/+$/, ''),
  头: (p, json) => Object.assign({ 'Content-Type': 'application/json' },
    p.apiKey ? { Authorization: 'Bearer ' + p.apiKey } : {}),
  // 改法: adapt 是数据不改代码 —— body 并进默认请求体, "{参数名}" 换成调用给的值, null 去掉默认字段
  改体: (体, a, p, 类) => {
    const ad = p.adapt?.[类];
    if (!ad) return 体;
    const out = JSON.parse(JSON.stringify(体));
    Object.entries(ad.body || {}).forEach(([k, v]) => {
      if (v === null) delete out[k];
      else if (typeof v === 'string' && /^\{.+\}$/.test(v)) {
        const 名 = v.slice(1, -1);
        if (a[名] !== undefined) out[k] = a[名]; else if (v === '{model}') out[k] = 体.model;
      } else out[k] = v;
    });
    return out;
  },
  发: async (p, url, opt) => 并发闸.跑(p, () => 网络请求(url, Object.assign(
    { headers: 模型调用.头(p), timeout: 120000, retries: 1 }, opt, p.proxy ? { 转发: p.proxy } : {}))),
  错: async (res, p) => {
    let t = await res.text().catch(() => '');
    try { const j = JSON.parse(t); t = j.error?.message || j.message || t; } catch (e) { }
    throw new Error(`${p.name} 回 ${res.status}: ${String(t).slice(0, 300)}`);
  },
  chat: async (p, a) => {
    const 协 = 协议[p.protocol || 'openai-compatible'], 体 = 模型调用.改体(协.对话请求(a, p), a, p, 'chat');
    const res = await 模型调用.发(p, 模型调用.基(p) + 协.类型.chat.后缀,
      { method: 'POST', body: JSON.stringify(体) });
    if (!res.ok) await 模型调用.错(res, p);
    return 协.解析回复(await res.json(), p);
  },
  // 流式: 一行行 data: 解析, 文字逐片 {delta}, 思考 {reasoning}, 工具参数 {tool, chars}, 末片 {done}
  chatStream: async function* (p, a) {
    const 协 = 协议[p.protocol || 'openai-compatible'], 体 = 模型调用.改体(协.对话请求({ ...a, stream: true }, p), a, p, 'chat');
    const res = await 模型调用.发(p, 模型调用.基(p) + 协.类型.chat.后缀,
      { method: 'POST', body: JSON.stringify(体), timeout: 300000 });
    if (!res.ok) await 模型调用.错(res, p);
    const 读 = res.body.getReader(), 解 = new TextDecoder();
    let Buf = '', 全 = { content: '', reasoning: '', toolCalls: [] }, 工 = {};
    for (; ;) {
      const { done, value } = await 读.read();
      if (done) break;
      Buf += 解.decode(value, { stream: true });
      const 行s = Buf.split('\n'); Buf = 行s.pop();
      for (const 行 of 行s) {
        const m = /^data:\s*(.*)$/.exec(行.trim());
        if (!m) continue;
        if (m[1] === '[DONE]') continue;
        let j; try { j = JSON.parse(m[1]); } catch (e) { continue; }
        const d = j.choices?.[0]?.delta || {};
        if (d.content) { 全.content += d.content; yield { delta: d.content }; }
        if (d.reasoning_content || d.reasoning) { const r = d.reasoning_content || d.reasoning; 全.reasoning += r; yield { reasoning: r }; }
        for (const t of d.tool_calls || []) {          // yield 只能在生成器里: 不能用 forEach 包
          const i = t.index ?? 0;
          工[i] = 工[i] || { id: '', name: '', args: '' };
          if (t.id) 工[i].id = t.id;
          if (t.function?.name) 工[i].name += t.function.name;
          if (t.function?.arguments) { 工[i].args += t.function.arguments; yield { tool: 工[i].name, chars: t.function.arguments }; }
        }
      }
    }
    全.toolCalls = Object.values(工).map(t => ({ id: t.id, name: t.name, args: JSON.parse(t.args || '{}') }));
    yield { done: true, ...全, usage: null };
  },
};

const 键 = 'settings:ai.providers';

async function 测通(provider, type = 'chat', model) {

  else if (type === 'image') r = await 模型调用.发(p, 模型调用.基(p) + '/images/generations',
    { method: 'POST', body: JSON.stringify({ model: model || p.modelOf?.image || 'test', prompt: 'a dot', n: 1 }) })
    .then(async res => res.ok ? { ok: true } : 模型调用.错(res, p));
  else if (type === 'embed') r = await 模型调用.发(p, 模型调用.基(p) + '/embeddings',
    { method: 'POST', body: JSON.stringify({ model: model || p.modelOf?.embed || 'test', input: 'hi' }) })

// ══════════ 技能 ══════════
// 只写猜不到的事实, 只有注释、不跑
// 【看和点】要看用户眼前有什么、替他点桌面上的东西时: 先 ui.state 看眼前是什么、有哪些东西(每样一个对象名)、
//   每类东西能做什么。再 ui.do {target, action, value}: target 用 ui.state 里的对象名(app:<id>、win:<窗>、
//   desk、desktop), action 用「能做」里列的名字, 带括号的要给 value。做完再 ui.state 看变化。
// 【写小应用】要新建或改小应用(孢子)时: apps.create {name, html} 存一个, apps.open {id} 开窗跑。
//   孢子跑在隔离窗里: 没有 colony、读不到本机存储, 要存东西就只在内存里; 它能经 mycelium.call 调宿主能力
//   (窗口里 globals.mycelium.call('ui.state') 这样), 过不了隔离窗的能力调用时会收到清楚的错。
// 【点选编辑】收到用户点选后「发给 agent」的卡片时: 卡片写着选择器和归属, 归属是块就改那块源码,
//   是 app:<id> 就 apps.update 它的代码。样式也可以直接写 settings:ui.skin({选择器: {属性: 值}}), 写完 ui.do {target:'desk', action:'重画'}。
// ══════════ 设计变量 ══════════
// 整个系统的设计变量归桌面块: 别的块照 var(--accent, 默认) 取, 这里一换它们跟着换
const 设计变量 = `:root{color-scheme:dark;--bg:#0b0d10;--bg-2:#12151a;--surface:rgba(255,255,255,.035);
--surface-hover:rgba(255,255,255,.07);--border:rgba(255,255,255,.09);--border-strong:rgba(255,255,255,.2);
--text:#e8ecf0;--text-muted:#9aa4ad;--accent:#7ee787;--accent-soft:rgba(126,231,135,.12);
--warn:#f5a623;--danger:#ff5757;--radius:10px;--mono:ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
--sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}`;
// ══════════ 状态 ══════════
const UI = {
  wins: new Map(),     // 'app:<id>' / '设置' / '口袋' / '示波器' → {el, 类, 帧?, 标题}
  apps: new Map(),     // 桌面上的孢子: id → {id, name, icon, html}
  皮肤: null,
};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => '&#' + c.charCodeAt(0) + ';');
const 新号 = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
const 听 = (el, ev, fn, 捕) => { el.addEventListener(ev, fn, 捕); ctx.cleanup(() => el.removeEventListener(ev, fn, 捕)); };
const 下载 = (name, text) => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'text/html;charset=utf-8' }));
  a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
// ══════════ 应用登记 ══════════
// 孢子: 一段 HTML, 隔离窗里跑。改了发 mycelium:apps
const 应用 = {
  async 载() {
    UI.apps.clear();
    for (const e of await ctx.kv.list('app:')) {
      const a = e.value;
      if (a?.html) UI.apps.set(a.id, a);
    }
  },
  列: () => [...UI.apps.values()].map(a => ({ id: a.id, name: a.name, icon: a.icon || '📦',
    字节: a.html.length, 改于: a.at })),
  async 建({ name, html, icon }) {
    if (typeof html !== 'string' || !html.trim()) throw new Error('缺 html: 孢子的内容');
    const a = { id: 新号('sp-'), name: name || '未命名孢子', icon: icon || '📦', html, at: Date.now() };
    await ctx.kv.set('app:' + a.id, a);
    await 应用.载();
    return a;
  },
  async 改(id, html) {
    const a = UI.apps.get(id) || await ctx.kv.get('app:' + id);
    if (!a) throw new Error(`没有这个孢子: ${id}`);
    a.html = html; a.at = Date.now();
    await ctx.kv.set('app:' + id, a);
    await 应用.载();
    return a;
  },
};
// ══════════ 窗口 ══════════
const 窗 = {
  开(键, { 题, 宽 = 520, 高 = 400, 内容, 类 = '' } = {}) {
    if (UI.wins.has(键)) { 窗.前置(键); return UI.wins.get(键); }
    const el = document.createElement('div');
    el.className = 'u-win ' + 类;
    el.innerHTML = `<div class="u-bar"><span class="u-t">${esc(题 || 键)}</span><span class="u-sp"></span>
<button class="u-b" data-a="min" title="收起">–</button><button class="u-b" data-a="max" title="最大化">□</button>
<button class="u-b" data-a="close" title="关">✕</button></div><div class="u-body"></div>`;
    el.style.cssText = `width:${宽}px;height:${高}px`;
    const 桌 = $('#desk');
    桌.appendChild(el);
    const 身 = el.querySelector('.u-body');
    if (内容) 内容(身, el);
    const 记 = { el, 身, 键, 题: 题 || 键 };
    UI.wins.set(键, 记);
    // 拖动: 标题栏按住就能挪
    const 条 = el.querySelector('.u-bar');
    听(条, 'pointerdown', e => {
      if (e.target.closest('.u-b')) return;
      const r = el.getBoundingClientRect(), dx = e.clientX - r.left, dy = e.clientY - r.top;
      const 移 = ev => { el.style.left = Math.max(0, ev.clientX - dx) + 'px'; el.style.top = Math.max(0, ev.clientY - dy) + 'px'; };
      const 起 = () => { document.removeEventListener('pointermove', 移); document.removeEventListener('pointerup', 起); };
      document.addEventListener('pointermove', 移);
      document.addEventListener('pointerup', 起);
    });
    听(el, 'click', e => {
      const 钮 = e.target.closest('.u-b'); if (!钮) return;
      if (钮.dataset.a === 'close') 窗.关(键);
      if (钮.dataset.a === 'min') el.classList.toggle('u-min');
      if (钮.dataset.a === 'max') el.classList.toggle('u-max');
    });
    听(el, 'pointerdown', () => 窗.前置(键), true);
    任务栏();
    return 记;
  },
  关(键) {
    const w = UI.wins.get(键);
    if (!w) return false;
    if (w.帧) ctx.call('hypha.unmount', { frame: w.帧 }).catch(() => { });
    w.el.remove();
    UI.wins.delete(键);
    任务栏();
    return true;
  },
  前置(键) { [...UI.wins.values()].forEach(w => w.el.style.zIndex = w.键 === 键 ? 10 : 1); },
  全部: () => [...UI.wins.keys()],
};
// ══════════ 任务栏与桌面 ══════════
function 任务栏() {
  const 栏 = $('#dock');
  if (!栏) return;
  栏.innerHTML = [...UI.apps.values()].map(a =>
    `<button class="u-dock" data-app="${esc(a.id)}" title="${esc(a.name)}">${a.icon || '📦'}</button>`).join('')
    + `<span class="u-dsp"></span>`
    + `<button class="u-dock" data-act="agent" title="全能 agent 对话栏">💬</button>`
    + ['设置', '口袋', '示波器', '模型'].map(k =>
      `<button class="u-dock" data-win="${k}" title="${k}">${k === '设置' ? '⚙' : k === '口袋' ? '🎒' : k === '示波器' ? '📈' : '🧠'}</button>`).join('');
}
// ══════════ 内置窗 ══════════
const 内置 = {
  模型(身) {
    // 借 ai 块的选模型小表: ai 不在跑时, 这份文件自带剪来的复制(照跑)
    let 表;
    try { 表 = 选模型; } catch (e) {
      身.innerHTML = `<div class="u-empty">选模型表要 ai 块在跑: ${esc(e.message)}</div>`;
      return;
    }
    Promise.resolve(表.挂(身, { 题: '选模型' }))
      .catch(e => { 身.innerHTML = `<div class="u-empty">选模型表没画出来: ${esc(e.message)}</div>`; });
  },
  设置(身) {
    // 内核的裸壳面板请进窗: 块管理、导入导出、改内核都走它(系统永远可操作)
    ctx.call('hypha.panel', { host: 身 })
      .catch(e => { 身.innerHTML = `<div class="u-empty">面板没画出来: ${esc(e.message)}</div>`; });
  },
  口袋(身) {
    // 口袋块在就请它(数据管理、归属守卫都在那边); 不在就用桌面自带的简版
    ctx.call('pocket.mount', { el: 身 }).catch(async () => {
      const 帽 = document.createElement('div');
      帽.innerHTML = `<div class="u-row"><input class="u-in" placeholder="搜数据前缀或键…" style="flex:1">
<button class="u-btn" data-a="snap">拍快照</button><button class="u-btn" data-a="list">列快照</button></div><div class="u-list"></div>`;
      身.appendChild(帽);
      const 列 = async (q = '') => {
        const 全 = await ctx.kv.list(''), 表 = 全.filter(e => !q || e.key.includes(q)).slice(0, 300);
        帽.querySelector('.u-list').innerHTML = 表.map(e => `<div class="u-item" data-k="${esc(e.key)}">
<span class="u-k">${esc(e.key)}</span><span class="u-v">${esc(JSON.stringify(e.value) ?? '').slice(0, 120)}</span>
<button class="u-btn" data-a="del">删</button></div>`).join('') || '<div class="u-empty">没有数据</div>';
      };
      听(帽, 'click', async e => {
        const 钮 = e.target.closest('button'); if (!钮) return;
        try {
          if (钮.dataset.a === 'snap') { await ctx.call('hypha.snapshot', { name: 新号('snap-') }); await 列(); }
          if (钮.dataset.a === 'list') {
            const 快照 = await ctx.call('hypha.snapshots');
            帽.querySelector('.u-list').innerHTML = 快照.map(s =>
              `<div class="u-item"><span class="u-k">${esc(s.name)}</span>
<span class="u-v">${new Date(s.at).toLocaleString()} · ${s.n} 键</span>
<button class="u-btn" data-a="back" data-n="${esc(s.name)}">回滚到这</button></div>`).join('')
              + `<div class="u-item"><button class="u-btn" data-a="all">返回数据列表</button></div>`;
          }
          if (钮.dataset.a === 'back') { await ctx.call('hypha.snapshot', { name: 钮.dataset.n, restore: true }); await 列(); }
          if (钮.dataset.a === 'all') await 列();
          if (钮.dataset.a === 'del') {
            const k = 钮.closest('.u-item').dataset.k;
            if (confirm(`删 ${k}?`)) { await ctx.kv.del(k); await 列(); }
          }
        } catch (err) { alert(err.message); }
      });
      听(帽.querySelector('input'), 'input', e => 列(e.target.value.trim()));
      列();
    });
  },
  示波器(身) {
    const 帽 = document.createElement('div');
    帽.innerHTML = `<div class="u-row"><span class="u-muted">能力调用记录(最近 100 条)</span></div><div class="u-list"></div>`;
    身.appendChild(帽);
    const 列 = async () => {
      const 痕 = await ctx.call('hypha.trace', { limit: 100 });
      帽.querySelector('.u-list').innerHTML = 痕.reverse().map(s => `<div class="u-item">
<span class="u-k">${esc(s.path)}</span><span class="u-v">${esc(s.by)} · ${s.ms}ms · ${s.ok ? '✓' : '✗ ' + esc(s.err || '')}</span>
</div>`).join('') || '<div class="u-empty">还没有调用</div>';
    };
    列();
    ctx.on('mycelium:span', 列);
  },
};
// ══════════ 开孢子 ══════════
async function 开孢子(id) {
  const a = UI.apps.get(id) || await ctx.kv.get('app:' + id);
  if (!a) throw new Error(`没有这个孢子: ${id}`);
  const w = 窗.开('app:' + id, { 题: (a.icon || '📦') + ' ' + a.name, 宽: 640, 高: 480 });
  if (w.帧) return w;
  try {
    const f = await ctx.call('hypha.mount', {
      code: a.html, host: w.身, context: { sporeId: id },
    });
    w.帧 = f.dataset.mycApp;
  } catch (e) {
    w.身.innerHTML = `<div class="u-empty">孢子没跑起来: ${esc(e.message)}</div>`;
  }
  return w;
}
// ══════════ 点选 ══════════
// 用户在桌面上划一片, 把那片的 HTML 连选择器一起发给 agent(卡片写着归属, agent 好改)
const 点选 = {
  开: false,
  始() {
    点选.开 = true;
    document.body.style.cursor = 'crosshair';
    $('#pick-tip').hidden = false;
  },
  止() {
    点选.开 = false;
    document.body.style.cursor = '';
    $('#pick-tip').hidden = true;
  },
};
// ══════════ 桌面 ══════════

#desk{position:fixed;inset:0;bottom:44px;overflow:hidden}
.u-win{position:absolute;left:80px;top:60px;background:var(--bg-2);border:1px solid var(--border);
  border-radius:var(--radius);box-shadow:0 12px 40px rgba(0,0,0,.5);display:flex;flex-direction:column;overflow:hidden}

.u-list{padding:0 10px 10px;font-size:12px}
.u-item{display:flex;gap:8px;align-items:center;padding:5px 8px;border:1px solid var(--border);border-radius:6px;margin:4px 0}

  padding:6px 12px;border-radius:8px;z-index:200}
#agent-dock{position:fixed;right:12px;bottom:56px;width:380px;height:480px;background:var(--bg-2);
  border:1px solid var(--border);border-radius:var(--radius);z-index:90;display:none;flex-direction:column;overflow:hidden;
  box-shadow:0 12px 40px rgba(0,0,0,.5)}
#agent-dock.in{display:flex}
#agent-dock .ag-bar{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--surface);
  border-bottom:1px solid var(--border);font-size:12px;font-weight:600;cursor:move;user-select:none}
#agent-dock .ag-bar .sp{flex:1}
#agent-dock .ag-bar button{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:13px;padding:2px 7px;border-radius:4px}

#agent-dock .ag-host{flex:1;overflow:hidden;display:flex;flex-direction:column;min-height:0}`,
  画() {
    const 样式 = document.createElement('style');
    样式.textContent = 桌面.样式;
    document.head.appendChild(样式);
    const 桌 = document.createElement('div');
    桌.id = 'desk';
    桌.innerHTML = `<div id="pick-tip" hidden>点选模式: 点桌面上的东西, 连它的 HTML 一起发给 agent(Esc 退出)</div>`;
    document.body.appendChild(桌);
    const 坞 = document.createElement('div');
    坞.id = 'dock';
    document.body.appendChild(坞);
    const 代 = document.createElement('div');
    代.id = 'agent-dock';
    代.innerHTML = `<div class="ag-bar">🤖 全能 agent<span class="sp"></span>
<button data-a="min" title="收起">–</button></div><div class="ag-host"></div>`;
    document.body.appendChild(代);
    听(代, 'click', e => {
      const 钮 = e.target.closest('button'); if (!钮) return;
      if (钮.dataset.a === 'min') 代.classList.remove('in');
    });
    ctx.cleanup(() => { 桌.remove(); 坞.remove(); 代.remove(); 样式.remove(); });
    // 桌面点选: 点中的元素连选择器一起进卡片
    听(桌, 'click', e => {
      if (!点选.开) return;
      const el = e.target.closest('[data-block-id],[data-spore],.u-win') || e.target;
      const 择 = el.dataset.blockId ? `[data-block-id="${el.dataset.blockId}"]`
        : el.dataset.spore ? `[data-spore="${el.dataset.spore}"]` : (el.id ? '#' + el.id : el.className);
      ctx.call('agent.attach', { name: '点选的 ' + (el.tagName || '').toLowerCase(),
        text: `选择器: ${择}\n归属: ${el.dataset.blockId ? '块 ' + el.dataset.blockId : el.dataset.spore ? '孢子 ' + el.dataset.spore : '桌面'}\n` + el.outerHTML.slice(0, 4000) })
        .then(() => { 点选.止(); }).catch(() => { });

// ══════════ 给 agent 的界面能力 ══════════
// ui.state 看眼前, ui.do 动手: 目标用对象名(app:<id>、win:<键>、desk、desktop), 动作照「能做」
ctx.provide('ui.state', () => ({
  桌面: { 对象: 'desk', 能做: ['重画', '点选模式'] },
  窗: 窗.全部().map(k => {
    const w = UI.wins.get(k);
    return { 对象: 'win:' + k, 题: w.题, 收起: w.el.classList.contains('u-min'), 帧: w.帧 || null,
      能做: ['前置', '关', '收起', '最大化'] };
  }),
  孢子: [...UI.apps.values()].map(a => ({ 对象: 'app:' + a.id, 名: a.name, 图标: a.icon,
    开着: UI.wins.has('app:' + a.id), 字节: a.html.length, 能做: ['开', '改代码', '删'] })),
}), { desc: '看界面上有什么: 桌面、开着的窗、孢子, 每样一个对象名和能做的动作', schema: {} });
ctx.provide('ui.do', a => {
  const [类, 名] = String(a.target || '').split(':');
  const 值 = a.value;
  if (a.target === 'desk' || a.target === 'desktop') {
    if (a.action === '重画') { 任务栏(); return { ok: true }; }
    if (a.action === '点选模式') { 点选.开 ? 点选.止() : 点选.始(); return { ok: true, 开: 点选.开 }; }
  }
  if (类 === 'app') {
    if (a.action === '开') return 开孢子(名).then(() => ({ ok: true }));
    if (a.action === '删') return ctx.kv.del('app:' + 名).then(() => 应用.载()).then(() => ({ ok: true }));
  }
  if (类 === 'win') {
    const w = UI.wins.get(名);
    if (!w) throw new Error(`没有开着的窗: ${a.target}(用 ui.state 看有哪些)`);
    if (a.action === '前置') { 窗.前置(名); return { ok: true }; }
    if (a.action === '关') return { ok: 窗.关(名) };
    if (a.action === '收起') { w.el.classList.toggle('u-min'); return { ok: true }; }
    if (a.action === '最大化') { w.el.classList.toggle('u-max'); return { ok: true }; }
  }
  throw new Error(`不会对 ${a.target} 做 ${a.action}(能用什么看 ui.state)`);
}, { desc: '对界面上的东西做动作: target 用 ui.state 里的对象名, action 用它「能做」里的名字',
  schema: { target: { type: 'string', description: '对象名' }, action: { type: 'string' }, value: {} } });
ctx.provide('apps.list', () => 应用.列(), { desc: '小应用(孢子)清单', schema: {} });
ctx.provide('apps.create', a => 应用.建(a), { desc: '建一个小应用(孢子): 一段 HTML, 隔离窗里跑',
  schema: { name: { type: 'string' }, html: { type: 'string' }, icon: { type: 'string' } } });
ctx.provide('apps.open', a => 开孢子(a.id).then(() => ({ ok: true })), { desc: '开一个小应用的窗',
  schema: { id: { type: 'string' } } });
ctx.provide('apps.update', a => 应用.改(a.id, a.html).then(() => ({ ok: true })), { desc: '改一个小应用的代码',
  schema: { id: { type: 'string' }, html: { type: 'string' } } });
ctx.provide('ui.host', () => true, { desc: '本块在跑: 有桌面(内核因此不挂兜底面板)', schema: {} });
// ══════════ 收编 ══════════
// 桌面是布局的唯一主人: 别的块的界面(ctx.root)本来在页面上流式堆着, 会被 #desk 盖住——
// 把它们收进该去的地方: agent → 右下对话栏; 别的块 → 各自的窗。块后装/被替换都会再收一次。
const 收编 = async () => {
  const 根们 = [...document.querySelectorAll('#mycelium-root > [data-nodule-id]')];
  if (!根们.length) return;
  let 名 = {};
  try { 名 = Object.fromEntries((await ctx.call('hypha.nodules')).map(b => [b.id, b])); } catch (e) { }
  for (const el of 根们) {
    const id = el.dataset.noduleId;
    if (id === 'desktop' || el.dataset.已收编) continue;
    el.dataset.已收编 = '1';
    const 块 = 名[id] || {};
    el.style.height = '100%';
    if (id === 'agent') {
      // 全能 agent: 右下常驻对话栏(默认开着, 任务栏能收起)
      const 代 = $('#agent-dock');
      if (代) {
        const 位 = 代.querySelector('.ag-host') || 代;
        位.appendChild(el);
        代.classList.add('in');
      }
      continue;
    }
    // 别的有界面的块(AI 配置、次元口袋…): 开一个窗, 把它的页搬进去
    窗.开('block:' + id, { 题: (块.icon || '▪') + ' ' + (块.name || id), 宽: 560, 高: 480,
      内容: 身 => 身.appendChild(el) });
  }
};
// ══════════ 装配 ══════════
(async () => {
  await 应用.载();
  if (ctx.root) {
    ctx.root.style.display = 'none';       // 桌面的界面直接画在 body 上, 这个根空着不用
    // 桌面画不上不耽误能力(ui.state/ui.do/apps.* 照常)
    try {
      桌面.画();
      // 用户自己的孢子默认铺在桌面上: 拖 HTML 文件进来也能建
      听(document, 'dragover', e => e.preventDefault());
      听(document, 'drop', async e => {
        e.preventDefault();
        const 文 = e.dataTransfer?.files?.[0];
        if (!文) return;
        const html = await 文.text();
        const a = await 应用.建({ name: 文.name.replace(/\.html?$/, ''), html });
        await 开孢子(a.id);
      });
      ctx.on('mycelium:apps', 任务栏);
      // 收编: 先收已在场的(ai/agent), 之后块变了(新装、被替换)再收
      收编().catch(e => ctx.log('收编没成:', e.message));
      ctx.on('mycelium:blocks', () => { 收编().catch(() => { }); });
    } catch (e) { ctx.log('桌面没画出来(能力照常用):', e.message); }
  }
})();
return {};
</script>
<script type="mycelium/nodule" data-id="pocket">
/*NODULE*/{"id":"pocket","name":"次元口袋","icon":"🎒","version":1,"caps":["data"]}/*CODE*/
'use strict';
// ↦ 借 hypha 的 离体运行时
// ══════════ 自报 ══════════
// 看、搜、改、删存着的数据; agent 要动数据也经这里(守归属: 谁的前缀谁管)
// 数据 {"prefix": "settings:pocket.", "label": "口袋设置(连着的文件夹)", "kind": "config"}
// 数据 {"prefix": "media:", "label": "文件和笔记", "kind": "data"}
// 现在 data.own
// ══════════ 技能 ══════════
// 只写猜不到的事实, 只有注释、不跑
// 【动数据】要读、写、删系统里的数据时: data.list 看有哪些前缀, data.get 读, data.set 写, data.del 删。
//   写到别的块认领的前缀会被挡(归它管, 改它走它自报里写的 edit 能力)——那是为了不让两块互相盖。
//   真要绕过(比如整库搬迁)用 data.clean {key, force: true}。删人的东西前三思, 删了回不来(除非有快照)。
// 【连电脑文件夹】用户要把某个文件夹接进来时: pocket.pickFolder 让用户亲手选(浏览器要求必须人点),
//   之后 disk:<文件夹名>/<路径> 就是那个文件夹里的文件, data.get/list 照常用, data.set 写回去。
// ══════════ 基础 ══════════
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => '&#' + c.charCodeAt(0) + ';');
// ══════════ 归属 ══════════
// 谁的前缀谁管: 各块在「自报」段里写 数据 {prefix…}, 最长的前缀算数。写了 edit 的前缀,
// 只有主人(或没有主人在跑)能经口袋写。两块认同一个前缀: 谁都不能经口袋写(说清是谁)。
const 归属 = {
  表: [],
  async 载() {
    const bs = (colony.单独 ? [{ id: ctx.id, name: '次元口袋', about: {
      desc: '看、搜、改、删存着的数据', data: [{ prefix: 'settings:pocket.', label: '口袋设置', kind: 'config' }] } }]
      : await ctx.call('hypha.nodules')).filter(b => !b.broken);
    归属.表 = bs.flatMap(b => ((b.about || {}).data || []).filter(n => n?.prefix)
      .map(n => Object.assign({}, n, { owner: b.id, 块: b.name || b.id, running: b.running })))
      .concat([{ prefix: 'block:', label: '块的改版', owner: 'hypha', 块: 'Hypha', running: true,
        edit: 'hypha.setNodule' }])
      .sort((a, b) => b.prefix.length - a.prefix.length);
  },
  of: k => 归属.表.find(n => k.startsWith(n.prefix)),
  守(k, by, 删) {
    if (删 && by === ctx.id) return;                    // 人在口袋里亲手点的删: 不拦
    const n = 归属.of(k);
    if (!n) return;
    if (n.两家) throw Object.assign(new Error(`「${k}」两块都认(${n.两家.join('、')}), 经口袋谁都不能写`), { 人话: '两块都认它, 这里改不了' });
    if (n.edit && by !== n.owner && n.running)
      throw Object.assign(new Error(`「${k}」归${n.块}管, 改它走 ${n.edit}`), { 人话: `归「${n.块}」管, 这里改不了` });
  },
};
// ══════════ 数据 ══════════
// agent 和人都经这几个能力动数据; 写之前过归属守卫, 每次写留痕(journal)
ctx.provide('data.list', async a => {
  const 全 = await ctx.kv.list(a.prefix || '');
  return 全.filter(e => !e.key.startsWith('block:')).map(e => ({ key: e.key,
    值: JSON.stringify(e.value) ?? '', 字节: JSON.stringify(e.value)?.length || 0,
    归: 归属.of(e.key)?.块 || '(没人认领)' })).slice(0, a.limit || 500);
}, { desc: '列数据: 每项的键、值(JSON 摘要)、归哪块管; prefix 只要这个前缀', schema: {
  prefix: { type: 'string' }, limit: { type: 'number' } } });
ctx.provide('data.get', async a => {
  const v = await ctx.kv.get(a.key);
  if (v == null) throw new Error(`没有这个键: ${a.key}(用 data.list 看有哪些)`);
  return { key: a.key, value: v, 归: 归属.of(a.key)?.块 || '(没人认领)' };
}, { desc: '读一个键', schema: { key: { type: 'string', description: '键名' } } });
ctx.provide('data.set', async a => {
  归属.守(a.key, a.by || 'pocket');
  await ctx.kv.set(a.key, a.value);
  return { key: a.key, 字节: JSON.stringify(a.value)?.length || 0, 归: 归属.of(a.key)?.块 || '(没人认领, 已记在口袋名下)' };
}, { desc: '写一个键(值要能变 JSON); 归别的块管的前缀会被挡, 照提示走它的能力', schema: {
  key: { type: 'string', description: '键名' }, value: { description: '要存的值(能 JSON 化的都行)' },
  by: { type: 'string', description: '谁在写(挡归属时看)' } } });
ctx.provide('data.del', async a => {
  归属.守(a.key, a.by || 'pocket', true);
  await ctx.kv.del(a.key);
  return { key: a.key, 删了: true };
}, { desc: '删一个键(人在口袋里删不拦; agent 删归人的数据会被挡)', schema: {
  key: { type: 'string' }, by: { type: 'string' } } });
ctx.provide('data.own', async a => {
  await 归属.载();
  const n = 归属.of(a.key || '');
  return n ? { key: a.key, 归属: n.块, owner: n.owner, label: n.label, kind: n.kind,
    edit: n.edit || null, running: n.running } : { key: a.key, 归属: '(没人认领)' };
}, { desc: '一个键归哪块管、改它该走哪个能力', schema: { key: { type: 'string' } } });
ctx.provide('data.clean', async a => {
  if (!a.force) {
    const n = 归属.of(a.key);
    if (n && n.owner !== 'pocket') throw new Error(`「${a.key}」归${n.块}管, 要硬删给 force: true(想清楚)`);
  }
  await ctx.kv.del(a.key);
  return { key: a.key, 删了: true };
}, { desc: '硬删: 绕过归属守卫(整库搬迁、清理没人认领的数据用)', schema: {
  key: { type: 'string' }, force: { type: 'boolean' } } });
// ══════════ 口袋窗 ══════════
// 桌面块的「口袋」窗把这个挂进自己的窗体(pocket.mount); 没有桌面块时能力照常用
const 口袋 = {
  样式: `.pk{font:13px/1.6 -apple-system,"PingFang SC",sans-serif;color:var(--text,#e8ecf0);height:100%;display:flex;flex-direction:column}
.pk .row{display:flex;gap:8px;align-items:center;padding:10px}
.pk input{flex:1;background:rgba(255,255,255,.05);border:1px solid var(--border,rgba(255,255,255,.09));
  color:inherit;border-radius:6px;padding:5px 8px;font-size:12px}
.pk button{background:var(--accent-soft,rgba(126,231,135,.12));border:1px solid rgba(126,231,135,.35);
  color:var(--accent,#7ee787);border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer}
.pk .list{flex:1;overflow:auto;padding:0 10px 10px}
.pk .item{display:flex;gap:8px;align-items:center;padding:5px 8px;border:1px solid var(--border,rgba(255,255,255,.09));
  border-radius:6px;margin:4px 0;font-size:12px}
.pk .k{font-family:var(--mono,monospace);font-size:11px;color:var(--accent,#7ee787);max-width:38%;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk .v{flex:1;color:var(--text-muted,#9aa4ad);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk .own{font-size:10px;color:var(--text-muted,#9aa4ad);white-space:nowrap}
.pk .empty{color:var(--text-muted,#9aa4ad);text-align:center;padding:24px;font-size:12px}
.pk .edit{width:100%;min-height:120px;background:rgba(0,0,0,.3);border:1px solid var(--border);color:inherit;
  border-radius:6px;padding:8px;font-family:var(--mono,monospace);font-size:11px}`,
  async 挂(host) {
    const 听宿主 = (el, ev, fn) => { el.addEventListener(ev, fn); ctx.cleanup(() => el.removeEventListener(ev, fn)); };
    host.innerHTML = `<style>${口袋.样式}</style><div class="pk">
<div class="row"><input placeholder="搜键或值…"><button data-a="新">新键</button>
<button data-a="快照">拍快照</button><button data-a="文件夹">连文件夹</button></div>
<div class="list"></div></div>`;
    const 列 = async (q = '') => {
      const 全 = await ctx.kv.list(''), 表 = 全.filter(e => !q || e.key.includes(q)
        || JSON.stringify(e.value).includes(q)).slice(0, 300);
      host.querySelector('.list').innerHTML = 表.map(e => `<div class="item" data-k="${esc(e.key)}">
<span class="k">${esc(e.key)}</span>
<span class="v">${esc((JSON.stringify(e.value) ?? '').slice(0, 140))}</span>
<span class="own">${esc(归属.of(e.key)?.块 || '没人认领')}</span>
<button data-a="改">改</button><button data-a="删">删</button></div>`).join('')
        || '<div class="empty">没有数据</div>';
    };
    听宿主(host, 'click', async e => {
      const 钮 = e.target.closest('button'); if (!钮) return;
      const 项 = 钮.closest('.item'), k = 项?.dataset.k;
      try {
        if (钮.dataset.a === '新') {
          const 名 = prompt('新键的名字(前缀.名字):');
          if (!名) return;
          const 值 = prompt('值(JSON):', '{}');
          await ctx.kv.set(名, JSON.parse(值 || '{}'));
          await 列();
        }
        if (钮.dataset.a === '改' && k) {
          const v = await ctx.kv.get(k);
          const 值 = prompt(`改 ${k} 的值(JSON):`, JSON.stringify(v, null, 1));
          if (值 == null) return;
          await ctx.kv.set(k, JSON.parse(值));
          await 列();
        }
        if (钮.dataset.a === '删' && k) {
          if (!confirm(`删 ${k}?`)) return;
          await ctx.kv.del(k);
          await 列();
        }
        if (钮.dataset.a === '快照') { await ctx.call('hypha.snapshot', { name: 'snap-' + Date.now().toString(36) }); alert('拍好了, 设置窗里能回滚'); }
        if (钮.dataset.a === '文件夹') { await 磁盘.选(); }
      } catch (err) { alert(err.message); }
    });
    听宿主(host.querySelector('input'), 'input', e => 列(e.target.value.trim()));
    await 归属.载();
    await 列();
    ctx.on('mycelium:journal', () => { });
    return () => { host.innerHTML = ''; };
  },
};
ctx.provide('pocket.mount', a => 口袋.挂(a.el || a.host), { desc: '把口袋窗挂进 el(桌面的口袋窗用它)',
  schema: { el: {}, host: { type: 'string' } } });
// ══════════ 磁盘 ══════════
// 用户亲手选的文件夹: 键写 disk:<文件夹名>/<路径>。句柄存在库里(IndexedDB 能直接存句柄)
const 磁盘 = {
  async 选() {
    if (!window.showDirectoryPicker) throw new Error('这个浏览器不支持选文件夹(要 Chrome/Edge 86+)');
    const 柄 = await window.showDirectoryPicker();
    const 名 = 柄.name;
    await ctx.kv.set('settings:pocket.folder.' + 名, 柄);
    return { 连上: 名 };
  },
  柄: async 名 => ctx.kv.get('settings:pocket.folder.' + 名),
};
// ══════════ 装配 ══════════
if (ctx.root) {
  // 口袋窗挂不上不耽误能力(data.* 照常)
  try {
    const 位 = document.createElement('div');
    位.style.cssText = 'height:100%';
    ctx.root.appendChild(位);
    口袋.挂(位).then(off => off && ctx.cleanup(off)).catch(e => ctx.log('口袋窗没挂上:', e.message));
  } catch (e) { ctx.log('口袋窗没挂上(能力照常用):', e.message); }
}
(async () => { await 归属.载(); })();
return {};
</script>
